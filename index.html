<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container">
        <div id="var-container">
            <div id="variable1">click some numbers</div>
            <div id="variable2"></div>
        </div>
        <div id="clear-container">
            <button id="clear" class="clear button">C</button>
            <button id="deletion" class="clear button">D</button>
            <button id="division">/</button>
        </div>
        <div id="button-container">
            <div id="number-container">
                <div id="seven-nine">
                    <button id="seven" class="button">7</button>
                    <button id="eight" class="button">8</button>
                    <button id="nine" class="button">9</button>
                </div>
                <div id="four-six">
                    <button id="four" class="button">4</button>
                    <button id="five" class="button">5</button>
                    <button id="six" class="button">6</button>
                </div>
                <div id="one-three">
                    <button id="one" class="button">1</button>
                    <button id="two" class="button">2</button>
                    <button id="three" class="button">3</button>
                </div>

                <button id="zero" class="button">0</button>
            </div>

            <div id="operations-container">


                <button id="multipplication" class="button">*</button>
                <button id="subtraction" class="button">-</button>
                <button id="addition" class="button">+</button>
                <button id="equal" class="button">=</button>
            </div>
        </div>
    </div>




</body>

</html>
