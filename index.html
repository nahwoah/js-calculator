<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="calculate.js"></script>
</head>

<body>
    <div id="body-container">
        <div id="calc">Calculator</div>
        <div id="container" class="buttons">
            <div id="var-container">
                <div id="display">0</div>
                <!-- <div id="variable1">0</div>
                <div id="variable2"></div> -->
            </div>

            <div id="button-container">
                <div id="number-container">
                    <div id="seven-nine">
                        <button id="seven">7</button>
                        <button id="eight">8</button>
                        <button id="nine">9</button>
                    </div>

                    <div id="four-six">
                        <button id="four">4</button>
                        <button id="five">5</button>
                        <button id="six">6</button>
                    </div>

                    <div id="one-three">
                        <button id="one">1</button>
                        <button id="two">2</button>
                        <button id="three">3</button>
                    </div>

                    <button id="zero">0</button>
                </div>

                <div id="operations-container">
                    <div id="clear-container">
                        <button id="clear" class="clear button">C</button>
                        <button id="deletion" class="clear button">D</button>

                    </div>

                    <div id="ops1">
                        <button id="multiplication" class="button">*</button>
                        <button id="division" class="button">/</button>
                    </div>
                    <div id="ops2">
                        <button id="subtraction" class="button">-</button>
                        <button id="addition" class="button">+</button>
                    </div>
                    <div id="ops3">
                        <button id="comma" class="button">.</button>
                        <button id="equal" class="button">=</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>

</html>
